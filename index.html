<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D HSV Color Visualizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>3D HSV Color Visualizer</h1>
    <div class="content-wrapper">
      <canvas id="hsvCone" width="400" height="400"></canvas>
      <div class="controls-wrapper">
        <div class="controls">
          <label>
            Hue Mode:
            <select id="hueMode">
              <option value="degrees">Degrees (0–360)</option>
              <option value="opencv">OpenCV (0–179)</option>
            </select>
          </label>
          
          <label>Hue (H): 
            <input type="range" id="hue" min="0" max="360" value="20">
            <input type="number" id="hueVal" min="0" max="360" value="20">
            <span id="hueUnit">°</span>
          </label>

          <label>Saturation (S): 
            <input type="range" id="sat" min="0" max="255" value="201">
            <input type="number" id="satVal" min="0" max="255" value="201">
          </label>

          <label>Value (V): 
            <input type="range" id="val" min="0" max="255" value="255">
            <input type="number" id="valVal" min="0" max="255" value="255">
          </label>
        </div>

        <div class="sample">
          <p>Selected Color:</p>
          <div id="colorBox"></div>
          <p id="hexDisplay">#FFFFFF</p>
        </div>
      </div>
    </div>
  </div>
  

    
  <script>
    /* Elements */
    const hue = document.getElementById("hue");
    const sat = document.getElementById("sat");
    const val = document.getElementById("val");
    const hueVal = document.getElementById("hueVal");
    const satVal = document.getElementById("satVal");
    const valVal = document.getElementById("valVal");
    const hueUnit = document.getElementById("hueUnit");
    const hueMode = document.getElementById("hueMode"); // new
    const colorBox = document.getElementById("colorBox");
    const hexDisplay = document.getElementById("hexDisplay");
    const canvas = document.getElementById("hsvCone");
    const ctx = canvas.getContext("2d");
    
    /* Camera */
    let camRadius = 600;
    let angleY = 0.0;
    let angleX = 0.35;
    let isDragging = false;
    let lastX = 0, lastY = 0;
    
    /* Cone dims (upside-down: base at top (y=0), apex at bottom (y=HEIGHT)) */
    const RADIUS = 150;
    const HEIGHT = 250;
    const TARGET = { x: 0, y: HEIGHT * 0.5, z: 0 };
    
    /* Hue mode state: "degrees" or "opencv" */
    let hueModeState = hueMode ? hueMode.value : "degrees";
    
    /* --- Helpers --- */
    function getCamera() {
      const cx = TARGET.x + camRadius * Math.cos(angleX) * Math.sin(angleY);
      const cy = TARGET.y + camRadius * Math.sin(angleX);
      const cz = TARGET.z + camRadius * Math.cos(angleX) * Math.cos(angleY);
    
      let fx = TARGET.x - cx, fy = TARGET.y - cy, fz = TARGET.z - cz;
      const fl = Math.hypot(fx, fy, fz); fx /= fl; fy /= fl; fz /= fl;
    
      let upx = 0, upy = 1, upz = 0;
    
      let rx = fy*upz - fz*upy;
      let ry = fz*upx - fx*upz;
      let rz = fx*upy - fy*upx;
      const rl = Math.hypot(rx, ry, rz) || 1; rx /= rl; ry /= rl; rz /= rl;
    
      upx = ry*fz - rz*fy;
      upy = rz*fx - rx*fz;
      upz = rx*fy - ry*fx;
    
      return { pos:{x:cx,y:cy,z:cz}, right:{x:rx,y:ry,z:rz}, up:{x:upx,y:upy,z:upz}, fwd:{x:fx,y:fy,z:fz} };
    }
    
    function worldToView(cam, x, y, z) {
      const vx = x - cam.pos.x;
      const vy = y - cam.pos.y;
      const vz = z - cam.pos.z;
      const xcam = vx*cam.right.x + vy*cam.right.y + vz*cam.right.z;
      const ycam = vx*cam.up.x    + vy*cam.up.y    + vz*cam.up.z;
      const zcam = vx*cam.fwd.x   + vy*cam.fwd.y   + vz*cam.fwd.z;
      return { x: xcam, y: ycam, z: zcam };
    }
    
    function project(cam, x, y, z) {
      const v = worldToView(cam, x, y, z);
      const f = 450;
      const nearPad = 0.0001;
      const scale = f / Math.max(v.z, nearPad);
      return {
        sx: canvas.width / 2 + v.x * scale,
        sy: canvas.height / 2 - v.y * scale,
        z: v.z
      };
    }
    
    /* HSV -> RGB expects degrees 0..360 for h */
    function HSVtoRGB(h, s, v) {
      s /= 255; v /= 255;
      const c = v * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = v - c;
      let r=0,g=0,b=0;
      if (0 <= h && h < 60) { r=c; g=x; b=0; }
      else if (60 <= h && h < 120) { r=x; g=c; b=0; }
      else if (120 <= h && h < 180) { r=0; g=c; b=x; }
      else if (180 <= h && h < 240) { r=0; g=x; b=c; }
      else if (240 <= h && h < 300) { r=x; g=0; b=c; }
      else { r=c; g=0; b=x; }
      return [
        Math.round((r+m)*255),
        Math.round((g+m)*255),
        Math.round((b+m)*255)
      ];
    }
    
    function rgbToHex(r, g, b) {
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
    }
    
    /* Tri projection helper */
    function triProjected(cam, A, B, C, col) {
      const p0 = project(cam, A.x, A.y, A.z);
      const p1 = project(cam, B.x, B.y, B.z);
      const p2 = project(cam, C.x, C.y, C.z);
      const zAvg = (p0.z + p1.z + p2.z) / 3;
      if (zAvg <= 0) return null;
      return { p0, p1, p2, z: zAvg, col };
    }
    
    /* Draw arrow primitive */
    function drawArrow(p1, p2) {
      ctx.beginPath();
      ctx.moveTo(p1.sx, p1.sy);
      ctx.lineTo(p2.sx, p2.sy);
      ctx.stroke();
    
      const angle = Math.atan2(p2.sy - p1.sy, p2.sx - p1.sx);
      const size = 10;
      ctx.beginPath();
      ctx.moveTo(p2.sx, p2.sy);
      ctx.lineTo(p2.sx - size * Math.cos(angle - Math.PI/6), p2.sy - size * Math.sin(angle - Math.PI/6));
      ctx.lineTo(p2.sx - size * Math.cos(angle + Math.PI/6), p2.sy - size * Math.sin(angle + Math.PI/6));
      ctx.closePath();
      ctx.fill();
    }
    
    /* Draw circular hue arc guide (full circle or partial arc) */
    function drawHueArc(cam, startTheta = 0, endTheta = Math.PI * 1.5, steps = 48) {
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const theta = startTheta + t * (endTheta - startTheta);
        const x = RADIUS * Math.cos(theta);
        const z = RADIUS * Math.sin(theta);
        const p = project(cam, x, 0, z);
        if (i === 0) ctx.moveTo(p.sx, p.sy);
        else ctx.lineTo(p.sx, p.sy);
      }
      ctx.stroke();
    
      // arrowhead at end
      const thetaEnd = endTheta;
      const xEnd = RADIUS * Math.cos(thetaEnd);
      const zEnd = RADIUS * Math.sin(thetaEnd);
      const pEnd = project(cam, xEnd, 0, zEnd);
    
      // small triangular arrow head
      const size = 6;
      ctx.beginPath();
      ctx.moveTo(pEnd.sx, pEnd.sy);
      ctx.lineTo(pEnd.sx - size, pEnd.sy - size);
      ctx.lineTo(pEnd.sx + size, pEnd.sy - size);
      ctx.closePath();
      ctx.fill();
    }
    
    /* Draw guides (Value, Saturation, Hue arc) */
    function drawGuides(cam) {
      ctx.strokeStyle = "black";
      ctx.fillStyle = "black";
      ctx.lineWidth = 2;
      ctx.font = "14px sans-serif";
    
      // Value (vertical)
      const pBase = project(cam, 0, 0, 0);
      const pApex = project(cam, 0, HEIGHT, 0);
      drawArrow(pBase, pApex);
      ctx.fillText("Value", pApex.sx + 6, pApex.sy);
    
      // Saturation (radial)
      const pCenter = project(cam, 0, 0, 0);
      const pEdge = project(cam, RADIUS, 0, 0);
      drawArrow(pCenter, pEdge);
      ctx.fillText("Saturation", pEdge.sx + 6, pEdge.sy);
    
      // Hue (circular arc)
      drawHueArc(cam, 0, Math.PI/2, 48);
      // place "Hue" near arc end
      const arcEndP = project(cam, RADIUS * Math.cos(Math.PI*0.6), 0, RADIUS * Math.sin(Math.PI*0.38));
      ctx.fillText("Hue", arcEndP.sx + 6, arcEndP.sy);
    }
    
    /* --- Main cone draw --- */
    function drawCone(hSliderValue, sValue, vValue) {
      // fill gray background
      ctx.fillStyle = "#ddd";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    
      const cam = getCamera();
    
      const stepsH = 48;
      const stepsV = 24;
      const faces = [];
    
      for (let i = 0; i < stepsV; i++) {
        const t1 = i / stepsV;
        const t2 = (i + 1) / stepsV;
        const r1 = (1 - t1) * RADIUS;
        const r2 = (1 - t2) * RADIUS;
        const y1 = t1 * HEIGHT;
        const y2 = t2 * HEIGHT;
        const Vlayer = (1 - (t1 + t2) * 0.5) * 255;
    
        for (let j = 0; j < stepsH; j++) {
          const a1 = (j / stepsH) * 2 * Math.PI;
          const a2 = ((j + 1) / stepsH) * 2 * Math.PI;
          const hueDeg = (j / stepsH) * 360;
    
          const P11 = { x: r1 * Math.cos(a1), y: y1, z: r1 * Math.sin(a1) };
          const P12 = { x: r1 * Math.cos(a2), y: y1, z: r1 * Math.sin(a2) };
          const P21 = { x: r2 * Math.cos(a1), y: y2, z: r2 * Math.sin(a1) };
          const P22 = { x: r2 * Math.cos(a2), y: y2, z: r2 * Math.sin(a2) };
    
          const col = HSVtoRGB(hueDeg, 255, Vlayer);
    
          const tri1 = triProjected(cam, P11, P12, P22, col);
          const tri2 = triProjected(cam, P11, P22, P21, col);
    
          if (tri1) faces.push(tri1);
          if (tri2) faces.push(tri2);
        }
      }
    
      // base disk (top)
      for (let j = 0; j < stepsH; j++) {
        const a1 = (j / stepsH) * 2 * Math.PI;
        const a2 = ((j + 1) / stepsH) * 2 * Math.PI;
        const P0  = { x: 0, y: 0, z: 0 };
        const P1  = { x: RADIUS * Math.cos(a1), y: 0, z: RADIUS * Math.sin(a1) };
        const P2  = { x: RADIUS * Math.cos(a2), y: 0, z: RADIUS * Math.sin(a2) };
        const hueDeg = (j / stepsH) * 360;
        const col = HSVtoRGB(hueDeg, 255, 255);
        const tri = triProjected(cam, P0, P1, P2, col);
        if (tri) faces.push(tri);
      }
    
      faces.sort((a, b) => a.z - b.z);
    
      for (const f of faces) {
        ctx.beginPath();
        ctx.moveTo(f.p0.sx, f.p0.sy);
        ctx.lineTo(f.p1.sx, f.p1.sy);
        ctx.lineTo(f.p2.sx, f.p2.sy);
        ctx.closePath();
        ctx.fillStyle = `rgb(${f.col[0]},${f.col[1]},${f.col[2]})`;
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.08)";
        ctx.stroke();
      }
    
      // Selected marker
      // hueSliderValue is raw slider value (in chosen mode). Convert to degrees for angle and HSV->RGB
      const hueDegrees = (hueModeState === "opencv") ? (hSliderValue * 2) : hSliderValue;
      const ang = (hueDegrees * Math.PI) / 180;
      const available = (vValue / 255) * RADIUS;
      const rSel = (sValue / 255) * available;
      const ySel = (1 - vValue / 255) * HEIGHT;
      const sx = rSel * Math.cos(ang);
      const sz = rSel * Math.sin(ang);
    
      const pSel = project(cam, sx, ySel, sz);
      const [rs, gs, bs] = HSVtoRGB(hueDegrees, sValue, vValue);
    
      ctx.beginPath();
      ctx.arc(pSel.sx, pSel.sy, 6, 0, Math.PI * 2);
      ctx.fillStyle = `rgb(${rs},${gs},${bs})`;
      ctx.fill();
      ctx.strokeStyle = "#222";
      ctx.stroke();
    
      // Guides
      drawGuides(cam);
    }
    
    /* --- UI update glue --- */
    function updateDisplayAndDraw() {
      const hRaw = parseInt(hue.value, 10);
      const sVal = parseInt(sat.value, 10);
      const vVal = parseInt(val.value, 10);
    
      // Update displayed numbers
      hueVal.value = hRaw;
      satVal.value = sVal;
      valVal.value = vVal;
    
      // Show chosen color in box (convert raw hue to degrees for conversion)
      const hueDegrees = (hueModeState === "opencv") ? hRaw * 2 : hRaw;
      const [r, g, b] = HSVtoRGB(hueDegrees, sVal, vVal);
      colorBox.style.backgroundColor = `rgb(${r},${g},${b})`;
      hexDisplay.textContent = rgbToHex(r, g, b);
    
      drawCone(hRaw, sVal, vVal);
    }
    
    /* --- Hue mode handling --- */
    function setHueMode(mode) {
      const oldMode = hueModeState;
      const oldMax = (oldMode === "opencv") ? 179 : 360;
      const newMax = (mode === "opencv") ? 179 : 360;
      // preserve relative position
      let oldVal = parseInt(hue.value, 10);
      let newVal = Math.round((oldVal / oldMax) * newMax);
      newVal = Math.max(0, Math.min(newMax, newVal));
      hue.max = newMax;
      hueVal.max = newMax;
      hue.value = newVal;
      hueVal.value = newVal;
      hueModeState = mode;
      hueUnit.textContent = (mode === "degrees") ? "°" : "";
      updateDisplayAndDraw();
    }
    
    if (hueMode) {
      // initialize select value to current state
      hueMode.value = hueModeState;
      hueMode.addEventListener("change", (e) => {
        setHueMode(e.target.value);
      });
    }
    
    /* --- Orbit controls (camera movement) --- */
    canvas.addEventListener("mousedown", e => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });
    canvas.addEventListener("mousemove", e => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      angleY += dx * 0.01;
      angleX -= dy * 0.01;
      const lim = Math.PI/2 - 0.05;
      angleX = Math.max(-lim, Math.min(lim, angleX));
      lastX = e.clientX;
      lastY = e.clientY;
      updateDisplayAndDraw();
    });
    ["mouseup","mouseleave"].forEach(ev => canvas.addEventListener(ev, () => { isDragging = false; }));
    
    /* --- Slider events --- */
    hue.addEventListener("input", updateDisplayAndDraw);
    sat.addEventListener("input", updateDisplayAndDraw);
    val.addEventListener("input", updateDisplayAndDraw);
    
    /* --- Number input events --- */
    hueVal.addEventListener("input", () => {
      let newVal = parseInt(hueVal.value, 10);
      if (isNaN(newVal)) newVal = 0;
      const minVal = parseInt(hueVal.min, 10);
      const maxVal = parseInt(hueVal.max, 10);
      newVal = Math.max(minVal, Math.min(maxVal, newVal));
      hue.value = newVal;
      hueVal.value = newVal;
      updateDisplayAndDraw();
    });

    satVal.addEventListener("input", () => {
      let newVal = parseInt(satVal.value, 10);
      if (isNaN(newVal)) newVal = 0;
      const minVal = parseInt(satVal.min, 10);
      const maxVal = parseInt(satVal.max, 10);
      newVal = Math.max(minVal, Math.min(maxVal, newVal));
      sat.value = newVal;
      satVal.value = newVal;
      updateDisplayAndDraw();
    });

    valVal.addEventListener("input", () => {
      let newVal = parseInt(valVal.value, 10);
      if (isNaN(newVal)) newVal = 0;
      const minVal = parseInt(valVal.min, 10);
      const maxVal = parseInt(valVal.max, 10);
      newVal = Math.max(minVal, Math.min(maxVal, newVal));
      val.value = newVal;
      valVal.value = newVal;
      updateDisplayAndDraw();
    });
    
    /* Initialize: ensure hue slider max matches initial mode */
    (function init() {
      // If hueMode select not present, default to degrees (preserve backward compatibility)
      if (!hueMode) hueModeState = "degrees";
      setHueMode(hueModeState);
    })();
    </script>
    
       
    
</body>
</html>

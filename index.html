<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive 3D visualisation of the HSV colour space as a cone, rendered with a hand-written camera and perspective projection on a 2D canvas.">
  <title>3D HSV Color Visualizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>3D HSV Color Visualizer</h1>
    <div class="content-wrapper">
      <canvas id="hsvCone" width="400" height="400"></canvas>
      <div class="controls-wrapper">
        <div class="controls">
          <label>
            Hue Mode:
            <select id="hueMode">
              <option value="degrees">Degrees (0–360)</option>
              <option value="opencv">OpenCV (0–179)</option>
            </select>
          </label>
          
          <label>Hue (H): 
            <input type="range" id="hue" min="0" max="360" value="20">
            <input type="number" id="hueVal" min="0" max="360" value="20">
            <span id="hueUnit">°</span>
          </label>

          <label>Saturation (S): 
            <input type="range" id="sat" min="0" max="255" value="201">
            <input type="number" id="satVal" min="0" max="255" value="201">
          </label>

          <label>Value (V): 
            <input type="range" id="val" min="0" max="255" value="255">
            <input type="number" id="valVal" min="0" max="255" value="255">
          </label>
        </div>

        <div class="sample">
          <p>Selected Color:</p>
          <div id="colorBox"></div>
          <p id="hexDisplay">#FFFFFF</p>
        </div>
      </div>
    </div>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
